name: Docs

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      # The Nepali Utils app in example/ is served at /tool/.
      - 'example/**'
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Nepali Utils
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --wasm --base-href /tool/
      - name: Copy Nepali Utils into the docs site
        run: |
          rm -rf docs/public/tool
          cp -R example/build/web docs/public/tool
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
